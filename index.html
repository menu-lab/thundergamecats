<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ThunderCats - Arcade Phoenix</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background-color: #060209;
      color: #fff;
      font-family: 'Press Start 2P', monospace, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* 1. CALUGA PROMOCIONAL SUPERIOR (Fija arriba con WhatsApp) */
    #promo-header {
      height: 52px;
      background: #14051e;
      border-bottom: 2px solid #d32228;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      gap: 8px;
      z-index: 30;
      box-shadow: 0 4px 10px rgba(0,0,0,0.8);
      flex-shrink: 0;
    }

    .promo-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .promo-title {
      font-size: 8px;
      color: #ffcc00;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .promo-sub {
      font-size: 6.5px;
      color: #ffd8d8;
      white-space: nowrap;
    }

    .btn-wa {
      background: #25d366;
      color: #fff;
      text-decoration: none;
      font-size: 8px;
      font-weight: bold;
      padding: 8px 10px;
      border-radius: 6px;
      white-space: nowrap;
      border: 1.5px solid #1aa84f;
      box-shadow: 0 2px 0 #12632f;
      flex-shrink: 0;
    }

    .btn-wa:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    /* 2. BARRA HUD ARCADE (Puntos, Nivel y Botón del Ojo en el centro) */
    #arcade-hud {
      height: 48px;
      background: #090212;
      border-bottom: 2px solid #ffcc00;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 12px;
      z-index: 25;
      flex-shrink: 0;
    }

    .hud-col {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .hud-label {
      font-size: 6px;
      color: #888;
    }

    .hud-val {
      font-size: 9px;
      color: #ffcc00;
    }

    /* Botón del Ojo incorporado arriba en el HUD */
    #eye-btn-top {
      height: 38px;
      padding: 0 12px;
      border-radius: 19px;
      background: #1c0926;
      border: 2px solid #4a1c66;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 3px 0 #0c0211;
      transition: all 0.2s;
    }

    #eye-btn-top.ready {
      background: linear-gradient(180deg, #e52521 0%, #8e0b0d 100%);
      border-color: #ffcc00;
      box-shadow: 0 0 14px rgba(255, 204, 0, 0.8), 0 3px 0 #520507;
      animation: pulseEye 0.6s infinite alternate;
    }

    @keyframes pulseEye {
      from { transform: scale(1); }
      to { transform: scale(1.06); }
    }

    .eye-icon {
      font-size: 16px;
      line-height: 1;
    }

    .eye-txt {
      font-size: 7px;
      color: #aaa;
    }

    #eye-btn-top.ready .eye-txt {
      color: #ffcc00;
      font-weight: bold;
    }

    /* 3. PANTALLA DEL JUEGO */
    #game-container {
      width: 100%;
      flex: 1;
      background: #090212;
      position: relative;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>

  <!-- Caluga Promocional Superior Fija con WhatsApp -->
  <header id="promo-header">
    <div class="promo-info">
      <span class="promo-title">⚡ ¿CUÁL ES LA PROMO DE HOY?</span>
      <span class="promo-sub">Pase VIP ThunderCats • Consulta por WhatsApp</span>
    </div>
    <a href="https://wa.me/56991081769?text=Hola!%20Tengo%20el%20cartucho%20ThunderCats,%20%C2%BFcu%C3%A1l%20es%20la%20promoci%C3%B3n%20sorpresa%20de%20hoy?" class="btn-wa">
      WHATSAPP
    </a>
  </header>

  <!-- Barra Arcade HUD Superior: Puntos, Botón Bomba y Nivel -->
  <div id="arcade-hud">
    <div class="hud-col">
      <span class="hud-label">PUNTOS</span>
      <span class="hud-val" id="hudScore">0000</span>
    </div>

    <!-- Botón del Ojo de Thundera en el centro superior -->
    <div id="eye-btn-top">
      <span class="eye-icon" id="eyeIcon">👁️</span>
      <span class="eye-txt" id="eyeTxt">0%</span>
    </div>

    <div class="hud-col" style="text-align: right;">
      <span class="hud-label">NIVEL</span>
      <span class="hud-val" id="hudLevel">1</span>
    </div>
  </div>

  <!-- Pantalla del Juego a Pantalla Completa hasta el fondo -->
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');
    
    const hudScore = document.getElementById('hudScore');
    const hudLevel = document.getElementById('hudLevel');
    const eyeBtn = document.getElementById('eye-btn-top');
    const eyeIcon = document.getElementById('eyeIcon');
    const eyeTxt = document.getElementById('eyeTxt');

    function resizeCanvas() {
      canvas.width = container.clientWidth || window.innerWidth;
      canvas.height = container.clientHeight || (window.innerHeight - 100);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let score = 0;
    let highScore = 0;
    let level = 1;
    let gameState = 'START';
    let frames = 0;
    let levelUpTimer = 0;
    let flashScreenTimer = 0;

    // Sistema de carga del Ojo (Bomba)
    let eyeKills = 0;
    const KILLS_NEEDED = 7;

    function updateEyeUI() {
      const pct = Math.min(100, Math.floor((eyeKills / KILLS_NEEDED) * 100));
      if (eyeKills >= KILLS_NEEDED) {
        eyeBtn.classList.add('ready');
        eyeIcon.textContent = "🔥";
        eyeTxt.textContent = "PODER";
      } else {
        eyeBtn.classList.remove('ready');
        eyeIcon.textContent = "👁️";
        eyeTxt.textContent = pct + "%";
      }
      hudScore.textContent = score.toString().padStart(4, '0');
      hudLevel.textContent = level;
    }

    // León-O
    const player = {
      x: 160,
      y: 0,
      w: 38,
      h: 44,
      targetX: 160,

      draw() {
        ctx.fillStyle = '#ff5500'; // Melena
        ctx.fillRect(this.x + 4, this.y, 30, 14);

        ctx.fillStyle = '#ffcc99'; // Rostro
        ctx.fillRect(this.x + 8, this.y + 10, 22, 12);

        ctx.fillStyle = '#0055d4'; // Traje azul
        ctx.fillRect(this.x + 6, this.y + 22, 26, 14);

        ctx.fillStyle = '#d32228'; // Cinturón
        ctx.fillRect(this.x + 15, this.y + 28, 8, 8);

        ctx.fillStyle = '#ffcc99'; // Botas
        ctx.fillRect(this.x + 8, this.y + 36, 8, 8);
        ctx.fillRect(this.x + 22, this.y + 36, 8, 8);

        // Espada del Augurio en la mano
        ctx.fillStyle = '#cccccc';
        ctx.fillRect(this.x + 18, this.y - 10, 3, 12);
        ctx.fillStyle = '#ffcc00';
        ctx.fillRect(this.x + 16, this.y + 2, 7, 3);
      },

      update() {
        this.x = Math.max(10, Math.min(canvas.width - this.w - 10, this.targetX - (this.w / 2)));
        this.y = canvas.height - 58;
      },

      reset() {
        this.targetX = canvas.width / 2;
        this.y = canvas.height - 58;
        this.update();
      }
    };

    // 1 SOLO RAYO TIPO TRUENO / RELÁMPAGO (Cadencia más lenta)
    let lightningBeams = [];
    const SHOOT_INTERVAL = 26; // Cadencia pausada

    function shootLightning() {
      lightningBeams.push({
        x: player.x + 18,
        y: player.y - 12,
        speed: 7, // Velocidad pausada
        length: 32,
        seed: Math.random() * 100
      });
    }

    function drawLightningBolt(b) {
      ctx.save();
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = '#00ffff'; // Aura celeste de trueno
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 8;

      ctx.beginPath();
      let startX = b.x;
      let startY = b.y;
      ctx.moveTo(startX, startY);

      // Forma en zigzag tipo trueno
      let segs = 4;
      let segH = b.length / segs;
      for (let s = 1; s <= segs; s++) {
        let offsetX = (s % 2 === 0 ? 5 : -5);
        ctx.lineTo(startX + offsetX, startY + (s * segH));
      }
      ctx.stroke();

      // Núcleo blanco del relámpago
      ctx.lineWidth = 1.8;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
      ctx.restore();
    }

    // Enemigos
    const MUTANT_TYPES = [
      { color: '#2f822d', hp: 1, w: 32, h: 22 },
      { color: '#b0651e', hp: 1, w: 34, h: 24 },
      { color: '#7b3ba8', hp: 1, w: 34, h: 24 },
      { color: '#2c3e50', hp: 1, w: 32, h: 20 }
    ];

    let enemies = [];
    function spawnEnemy() {
      const isMummRa = (Math.random() < 0.12 && score > 600);
      if (isMummRa) {
        enemies.push({
          type: 'MUMMRA',
          hp: 4,
          maxHp: 4,
          x: Math.random() * (canvas.width - 50 - 20) + 10,
          y: -46,
          w: 50,
          h: 40,
          speed: 0.9 + (level * 0.12)
        });
      } else {
        const t = MUTANT_TYPES[Math.floor(Math.random() * MUTANT_TYPES.length)];
        enemies.push({
          type: 'MUTANT',
          color: t.color,
          hp: t.hp,
          maxHp: t.hp,
          x: Math.random() * (canvas.width - t.w - 20) + 10,
          y: -30,
          w: t.w,
          h: t.h,
          speed: (0.7 + Math.random() * 0.4) + (level * 0.15)
        });
      }
    }

    // Bomba Ojo de Thundera
    function triggerEyeBomb() {
      if (eyeKills < KILLS_NEEDED) return;
      eyeKills = 0;
      updateEyeUI();

      flashScreenTimer = 16;

      enemies.forEach(en => {
        score += (en.type === 'MUMMRA' ? 500 : 100);
      });
      enemies = [];
    }

    function setTargetFromTouch(e) {
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      if (touch) {
        player.targetX = touch.clientX - rect.left;
      }
    }

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (gameState === 'START') {
        gameState = 'PLAY';
        score = 0;
        level = 1;
        eyeKills = 0;
        lightningBeams = [];
        enemies = [];
        player.reset();
        updateEyeUI();
      } else if (gameState === 'GAMEOVER') {
        gameState = 'START';
      } else {
        setTargetFromTouch(e);
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (gameState === 'PLAY') {
        setTargetFromTouch(e);
      }
    }, { passive: false });

    eyeBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (gameState === 'PLAY') {
        triggerEyeBomb();
      }
    }, { passive: false });

    function loop() {
      if (flashScreenTimer > 0) {
        flashScreenTimer--;
        ctx.fillStyle = (flashScreenTimer % 2 === 0) ? '#ffcc00' : '#e52521';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#090212';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Estrellas
        ctx.fillStyle = '#fff';
        ctx.fillRect(45, 30, 2, 2);
        ctx.fillRect(210, 80, 2, 2);
        ctx.fillRect(130, 160, 2, 2);
        ctx.fillRect(280, 260, 2, 2);
        ctx.fillRect(80, 320, 2, 2);
      }

      if (gameState === 'PLAY') {
        frames++;

        // Cadencia más lenta de disparo
        if (frames % SHOOT_INTERVAL === 0) {
          shootLightning();
        }

        const spawnRate = Math.max(38, 75 - (level * 5));
        if (frames % spawnRate === 0) spawnEnemy();

        const currentLevel = Math.floor(score / 3000) + 1;
        if (currentLevel > level) {
          level = currentLevel;
          levelUpTimer = 90;
        }

        player.update();
        player.draw();

        // Actualizar y dibujar rayos trueno
        for (let i = 0; i < lightningBeams.length; i++) {
          let b = lightningBeams[i];
          b.y -= b.speed;
          drawLightningBolt(b);

          if (b.y < -40) {
            lightningBeams.splice(i, 1);
            i--;
          }
        }

        // Actualizar y dibujar enemigos
        for (let i = 0; i < enemies.length; i++) {
          let en = enemies[i];
          en.y += en.speed;

          if (en.type === 'MUMMRA') {
            ctx.fillStyle = '#a81316';
            ctx.fillRect(en.x, en.y, en.w, en.h);
            ctx.fillStyle = '#4c6572';
            ctx.fillRect(en.x + 8, en.y + 6, en.w - 16, 20);
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(en.x + 14, en.y + 12, 5, 5);
            ctx.fillRect(en.x + 30, en.y + 12, 5, 5);
            ctx.fillStyle = '#ffcc00';
            ctx.fillRect(en.x, en.y - 6, (en.w * (en.hp / en.maxHp)), 4);
          } else {
            ctx.fillStyle = en.color;
            ctx.fillRect(en.x, en.y + 6, en.w, en.h - 6);
            ctx.fillStyle = '#111';
            ctx.fillRect(en.x + 6, en.y, en.w - 12, 6);
            ctx.fillStyle = '#ffcc00';
            ctx.fillRect(en.x + 8, en.y + 10, 4, 4);
            ctx.fillRect(en.x + en.w - 12, en.y + 10, 4, 4);
          }

          // Impacto de rayo
          for (let j = 0; j < lightningBeams.length; j++) {
            let b = lightningBeams[j];
            if (
              b.x > en.x - 8 &&
              b.x < en.x + en.w + 8 &&
              b.y < en.y + en.h &&
              b.y + b.length > en.y
            ) {
              en.hp--;
              lightningBeams.splice(j, 1);

              if (en.hp <= 0) {
                score += (en.type === 'MUMMRA' ? 500 : 100);
                enemies.splice(i, 1);
                i--;

                if (eyeKills < KILLS_NEEDED) {
                  eyeKills++;
                }
                updateEyeUI();
              }
              break;
            }
          }

          // Colisión con jugador o tocan fondo
          if (
            en &&
            en.x < player.x + player.w &&
            en.x + en.w > player.x &&
            en.y < player.y + player.h &&
            en.y + en.h > player.y
          ) {
            gameState = 'GAMEOVER';
            if (score > highScore) highScore = score;
          }

          if (en && en.y > canvas.height) {
            gameState = 'GAMEOVER';
            if (score > highScore) highScore = score;
          }
        }

        if (levelUpTimer > 0) {
          levelUpTimer--;
          ctx.fillStyle = '#ffcc00';
          ctx.font = '12px "Press Start 2P"';
          ctx.textAlign = 'center';
          ctx.fillText("¡PASÓ DE NIVEL!", canvas.width / 2, canvas.height / 2 - 20);
          ctx.fillStyle = '#fff';
          ctx.font = '8px "Press Start 2P"';
          ctx.fillText("VELOCIDAD AUMENTADA", canvas.width / 2, canvas.height / 2 + 8);
          ctx.textAlign = 'left';
        }

      } else if (gameState === 'START') {
        player.reset();
        player.draw();

        ctx.fillStyle = '#ffcc00';
        ctx.font = '11px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText("THUNDERCATS", canvas.width / 2, canvas.height / 2 - 40);
        ctx.fillStyle = '#fff';
        ctx.font = '7.5px "Press Start 2P"';
        ctx.fillText("ARRASTRA TU DEDO PARA MOVER", canvas.width / 2, canvas.height / 2 - 14);
        ctx.fillText("DISPARO DE TRUENO CONTINUO", canvas.width / 2, canvas.height / 2 + 6);
        ctx.fillStyle = '#00ffcc';
        ctx.fillText("TOCA LA PANTALLA PARA JUGAR", canvas.width / 2, canvas.height / 2 + 30);
        ctx.textAlign = 'left';

      } else if (gameState === 'GAMEOVER') {
        ctx.fillStyle = '#000';
        ctx.fillRect(canvas.width / 2 - 125, canvas.height / 2 - 50, 250, 100);
        ctx.strokeStyle = '#d32228';
        ctx.lineWidth = 3;
        ctx.strokeRect(canvas.width / 2 - 125, canvas.height / 2 - 50, 250, 100);

        ctx.fillStyle = '#d32228';
        ctx.font = '12px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);

        ctx.fillStyle = '#ffcc00';
        ctx.font = '8px "Press Start 2P"';
        ctx.fillText("PUNTOS: " + score, canvas.width / 2, canvas.height / 2 + 4);
        ctx.fillText("RECORD: " + highScore, canvas.width / 2, canvas.height / 2 + 20);
        ctx.textAlign = 'left';
      }

      requestAnimationFrame(loop);
    }

    player.reset();
    updateEyeUI();
    loop();
  </script>
</body>
</html>
