<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ThunderCats - El Ojo de Thundera</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: #060209;
      color: #fff;
      font-family: 'Press Start 2P', monospace, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #header {
      height: 44px;
      background: #0f0516;
      border-bottom: 2px solid #d32228;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tc-badge {
      width: 22px;
      height: 22px;
      background: #d32228;
      border-radius: 50%;
      border: 2px solid #ffcc00;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .tc-title {
      font-size: 11px;
      color: #ffcc00;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 #d32228;
    }

    #canvas-container {
      width: 100%;
      flex: 1;
      background: #12041f;
      position: relative;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    #bottom-panel {
      height: 45vh;
      background: #0c0312;
      border-top: 3px solid #ffcc00;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px 14px 12px;
    }

    .promo-row {
      background: #1a0824;
      border: 2px solid #d32228;
      border-radius: 10px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .product-slot {
      width: 46px;
      height: 46px;
      background: #2b0c3a;
      border: 1.5px dashed #ffcc00;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .promo-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .promo-text {
      font-size: 7.5px;
      line-height: 1.3;
      color: #fff;
    }

    .promo-text strong {
      color: #ffcc00;
      font-size: 8.5px;
      display: block;
    }

    .btn-wa {
      background: #25d366;
      color: #fff;
      text-decoration: none;
      font-size: 8px;
      font-weight: bold;
      padding: 6px 8px;
      border-radius: 6px;
      align-self: flex-start;
      border: 1.5px solid #1aa84f;
      box-shadow: 0 3px 0 #12632f;
    }

    .btn-wa:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 1;
      padding-top: 6px;
    }

    .arrows-group {
      display: flex;
      gap: 10px;
    }

    .btn-arrow {
      width: 62px;
      height: 62px;
      background: #210d33;
      border: 3px solid #54227d;
      border-radius: 12px;
      color: #ffcc00;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 0 #12051d;
    }

    .btn-arrow:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #12051d;
      background: #ffcc00;
      color: #110517;
    }

    .eye-btn-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .btn-eye {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: #1c0827;
      border: 3px solid #551c72;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 5px 0 #0d0213;
      transition: all 0.2s;
    }

    .btn-eye.ready {
      background: linear-gradient(180deg, #e52521 0%, #8e0b0d 100%);
      border-color: #ffcc00;
      box-shadow: 0 5px 0 #520507, 0 0 14px rgba(255, 204, 0, 0.7);
    }

    .btn-eye.ready:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #520507;
    }

    .eye-symbol {
      font-size: 22px;
      line-height: 1;
    }

    .btn-label {
      font-size: 7px;
      color: #888;
    }

    .btn-label.ready {
      color: #ffcc00;
    }
  </style>
</head>
<body>

  <header id="header">
    <div class="tc-badge">⚡</div>
    <div class="tc-title">THUNDERCATS ARCADE</div>
  </header>

  <div id="canvas-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div id="bottom-panel">
    
    <div class="promo-row">
      <div class="product-slot">🍔</div>
      <div class="promo-content">
        <div class="promo-text">
          <strong>PROMO THUNDERCATS ⚡</strong>
          Consulta tu beneficio o combo especial del día.
        </div>
        <a href="https://wa.me/56991081769?text=Hola!%20Tengo%20el%20cartucho%20ThunderCats%20y%20quiero%20conocer%20la%20promocion%20de%20hoy" class="btn-wa">
          WHATSAPP
        </a>
      </div>
    </div>

    <div class="controls-row">
      <div class="arrows-group">
        <button class="btn-arrow" id="btnLeft">◀</button>
        <button class="btn-arrow" id="btnRight">▶</button>
      </div>

      <div class="eye-btn-wrapper">
        <button class="btn-eye" id="btnEye">
          <div class="eye-symbol" id="eyeSymbol">👁️</div>
        </button>
        <span class="btn-label" id="eyeLabel">CARGANDO</span>
      </div>
    </div>

  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');

    function resizeCanvas() {
      canvas.width = container.clientWidth || 360;
      canvas.height = container.clientHeight || 280;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let score = 0;
    let highScore = 0;
    let level = 1;
    let gameState = 'START';
    let frames = 0;
    let levelUpTimer = 0;

    let eyeCharge = 100;
    const chargeMax = 100;
    const chargeSpeed = 0.6;
    const btnEye = document.getElementById('btnEye');
    const eyeSymbol = document.getElementById('eyeSymbol');
    const eyeLabel = document.getElementById('eyeLabel');

    function updateEyeStatus() {
      if (eyeCharge < chargeMax) {
        eyeCharge = Math.min(chargeMax, eyeCharge + chargeSpeed);
      }

      if (eyeCharge >= chargeMax) {
        btnEye.classList.add('ready');
        eyeLabel.classList.add('ready');
        eyeLabel.textContent = "LISTO";
        eyeSymbol.textContent = "🔥";
      } else {
        btnEye.classList.remove('ready');
        eyeLabel.classList.remove('ready');
        eyeLabel.textContent = Math.floor((eyeCharge / chargeMax) * 100) + "%";
        eyeSymbol.textContent = "👁️";
      }
    }

    const player = {
      x: 160,
      y: 200,
      w: 36,
      h: 42,
      speed: 4.8,
      movingLeft: false,
      movingRight: false,

      draw() {
        ctx.fillStyle = '#ff5500';
        ctx.fillRect(this.x + 4, this.y, 28, 14);

        ctx.fillStyle = '#ffcc99';
        ctx.fillRect(this.x + 8, this.y + 10, 20, 12);

        ctx.fillStyle = '#0055d4';
        ctx.fillRect(this.x + 6, this.y + 22, 24, 14);

        ctx.fillStyle = '#d32228';
        ctx.fillRect(this.x + 14, this.y + 28, 8, 8);

        ctx.fillStyle = '#ffcc99';
        ctx.fillRect(this.x + 8, this.y + 36, 8, 6);
        ctx.fillRect(this.x + 20, this.y + 36, 8, 6);
      },

      update() {
        if (this.movingLeft && this.x > 8) this.x -= this.speed;
        if (this.movingRight && this.x + this.w < canvas.width - 8) this.x += this.speed;
      },

      reset() {
        this.x = canvas.width / 2 - this.w / 2;
        this.y = canvas.height - 50;
      }
    };

    let beams = [];
    function shootBeam() {
      if (eyeCharge < chargeMax) return;
      eyeCharge = 0;

      beams.push({ x: player.x + 8,  y: player.y - 6, w: 6, h: 20, speed: 8 });
      beams.push({ x: player.x + 22, y: player.y - 6, w: 6, h: 20, speed: 8 });
    }

    const MUTANT_TYPES = [
      { color: '#2f822d', hp: 1, w: 30, h: 22 },
      { color: '#a86520', hp: 1, w: 32, h: 24 },
      { color: '#7b3ba8', hp: 1, w: 34, h: 24 },
      { color: '#34495e', hp: 1, w: 32, h: 20 }
    ];

    let enemies = [];
    function spawnEnemy() {
      const isMummRa = (Math.random() < 0.12 && score > 600);

      if (isMummRa) {
        enemies.push({
          type: 'MUMMRA',
          hp: 4,
          maxHp: 4,
          x: Math.random() * (canvas.width - 48 - 20) + 10,
          y: -44,
          w: 48,
          h: 38,
          speed: 0.9 + (level * 0.15)
        });
      } else {
        const t = MUTANT_TYPES[Math.floor(Math.random() * MUTANT_TYPES.length)];
        enemies.push({
          type: 'MUTANT',
          color: t.color,
          hp: t.hp,
          maxHp: t.hp,
          x: Math.random() * (canvas.width - t.w - 20) + 10,
          y: -30,
          w: t.w,
          h: t.h,
          speed: (0.7 + Math.random() * 0.5) + (level * 0.18)
        });
      }
    }

    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');

    btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); player.movingLeft = true; }, { passive: false });
    btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); player.movingLeft = false; }, { passive: false });

    btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); player.movingRight = true; }, { passive: false });
    btnRight.addEventListener('touchend', (e) => { e.preventDefault(); player.movingRight = false; }, { passive: false });

    btnEye.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (gameState === 'START') {
        gameState = 'PLAY';
        score = 0;
        level = 1;
        beams = [];
        enemies = [];
        eyeCharge = 100;
        player.reset();
      } else if (gameState === 'PLAY') {
        shootBeam();
      } else if (gameState === 'GAMEOVER') {
        gameState = 'START';
      }
    }, { passive: false });

    function loop() {
      updateEyeStatus();

      ctx.fillStyle = '#0f041b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#fff';
      ctx.fillRect(50, 40, 2, 2);
      ctx.fillRect(220, 90, 2, 2);
      ctx.fillRect(140, 160, 2, 2);
      ctx.fillRect(290, 220, 2, 2);

      if (gameState === 'PLAY') {
        frames++;

        const spawnRate = Math.max(40, 75 - (level * 6));
        if (frames % spawnRate === 0) spawnEnemy();

        const currentLevel = Math.floor(score / 3000) + 1;
        if (currentLevel > level) {
          level = currentLevel;
          levelUpTimer = 90;
        }

        player.update();
        player.draw();

        for (let i = 0; i < beams.length; i++) {
          let b = beams[i];
          b.y -= b.speed;

          ctx.fillStyle = '#ffcc00';
          ctx.fillRect(b.x - 1, b.y, b.w + 2, b.h);
          ctx.fillStyle = '#d32228';
          ctx.fillRect(b.x, b.y + 2, b.w, b.h - 4);

          if (b.y < -20) {
            beams.splice(i, 1);
            i--;
          }
        }

        for (let i = 0; i < enemies.length; i++) {
          let en = enemies[i];
          en.y += en.speed;

          if (en.type === 'MUMMRA') {
            ctx.fillStyle = '#a81316';
            ctx.fillRect(en.x, en.y, en.w, en.h);
            ctx.fillStyle = '#4c6572';
            ctx.fillRect(en.x + 8, en.y + 6, en.w - 16, 20);
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(en.x + 14, en.y + 12, 5, 5);
            ctx.fillRect(en.x + 28, en.y + 12, 5, 5);
            ctx.fillStyle = '#ffcc00';
            ctx.fillRect(en.x, en.y - 6, (en.w * (en.hp / en.maxHp)), 4);
          } else {
            ctx.fillStyle = en.color;
            ctx.fillRect(en.x, en.y + 6, en.w, en.h - 6);
            ctx.fillStyle = '#111';
            ctx.fillRect(en.x + 6, en.y, en.w - 12, 6);
            ctx.fillStyle = '#ffcc00';
            ctx.fillRect(en.x + 8, en.y + 10, 4, 4);
            ctx.fillRect(en.x + en.w - 12, en.y + 10, 4, 4);
          }

          for (let j = 0; j < beams.length; j++) {
            let b = beams[j];
            if (
              b.x < en.x + en.w &&
              b.x + b.w > en.x &&
              b.y < en.y + en.h &&
              b.y + b.h > en.y
            ) {
              en.hp--;
              beams.splice(j, 1);

              if (en.hp <= 0) {
                score += (en.type === 'MUMMRA' ? 500 : 100);
                enemies.splice(i, 1);
                i--;
              }
              break;
            }
          }

          if (
            en &&
            en.x < player.x + player.w &&
            en.x + en.w > player.x &&
            en.y < player.y + player.h &&
            en.y + en.h > player.y
          ) {
            gameState = 'GAMEOVER';
            if (score > highScore) highScore = score;
          }

          if (en && en.y > canvas.height) {
            gameState = 'GAMEOVER';
            if (score > highScore) highScore = score;
          }
        }

        ctx.fillStyle = '#ffcc00';
        ctx.font = '10px "Press Start 2P"';
        ctx.fillText("PTS " + score, 14, 24);
        ctx.fillText("NIV " + level, canvas.width - 80, 24);

        if (levelUpTimer > 0) {
          levelUpTimer--;
          ctx.fillStyle = '#ffcc00';
          ctx.font = '11px "Press Start 2P"';
          ctx.textAlign = 'center';
          ctx.fillText("¡PASÓ DE NIVEL!", canvas.width / 2, canvas.height / 2 - 16);
          ctx.textAlign = 'left';
        }

      } else if (gameState === 'START') {
        player.reset();
        player.draw();

        ctx.fillStyle = '#ffcc00';
        ctx.font = '11px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText("THUNDERCATS", canvas.width / 2, canvas.height / 2 - 36);
        ctx.fillStyle = '#fff';
        ctx.font = '7.5px "Press Start 2P"';
        ctx.fillText("ESQUIVA MUTANTES Y MUMM-RA", canvas.width / 2, canvas.height / 2 - 14);
        ctx.fillStyle = '#00ffcc';
        ctx.fillText("TOCA EL OJO PARA EMPEZAR", canvas.width / 2, canvas.height / 2 + 16);
        ctx.textAlign = 'left';

      } else if (gameState === 'GAMEOVER') {
        ctx.fillStyle = '#000';
        ctx.fillRect(canvas.width / 2 - 120, canvas.height / 2 - 50, 240, 96);
        ctx.strokeStyle = '#d32228';
        ctx.lineWidth = 3;
        ctx.strokeRect(canvas.width / 2 - 120, canvas.height / 2 - 50, 240, 96);

        ctx.fillStyle = '#d32228';
        ctx.font = '12px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);

        ctx.fillStyle = '#ffcc00';
        ctx.font = '8px "Press Start 2P"';
        ctx.fillText("PUNTOS: " + score, canvas.width / 2, canvas.height / 2 + 2);
        ctx.fillText("RECORD: " + highScore, canvas.width / 2, canvas.height / 2 + 18);
        ctx.textAlign = 'left';
      }

      requestAnimationFrame(loop);
    }

    player.reset();
    loop();
  </script>
</body>
</html>
