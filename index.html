<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ThunderCats - Arcade Phoenix</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background-color: #060209;
      color: #fff;
      font-family: 'Press Start 2P', monospace, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Caluga Promocional Superior Fija */
    #promo-header {
      height: 54px;
      background: #150620;
      border-bottom: 2px solid #ffcc00;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      gap: 8px;
      z-index: 10;
      box-shadow: 0 4px 10px rgba(0,0,0,0.8);
    }

    .promo-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow: hidden;
    }

    .promo-title {
      font-size: 8px;
      color: #ffcc00;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .promo-sub {
      font-size: 6.5px;
      color: #ffd8d8;
      white-space: nowrap;
    }

    .btn-wa {
      background: #25d366;
      color: #fff;
      text-decoration: none;
      font-size: 8px;
      font-weight: bold;
      padding: 8px 10px;
      border-radius: 6px;
      white-space: nowrap;
      border: 1.5px solid #1aa84f;
      box-shadow: 0 2px 0 #12632f;
      flex-shrink: 0;
    }

    .btn-wa:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    /* Contenedor del Juego a Pantalla Completa */
    #game-container {
      width: 100%;
      flex: 1;
      background: #0a0312;
      position: relative;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    /* Botón Flotante del Ojo de Thundera (Bomba) */
    #eye-bomb-btn {
      position: absolute;
      bottom: 24px;
      right: 20px;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: rgba(20, 5, 28, 0.55);
      border: 3px solid rgba(255, 204, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 20;
      transition: all 0.25s ease;
    }

    #eye-bomb-btn.ready {
      background: radial-gradient(circle, #e52521 20%, #8e0b0d 90%);
      border: 3px solid #ffcc00;
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.8), inset 0 0 10px #ffcc00;
      animation: pulseGlow 0.6s infinite alternate;
      opacity: 1;
    }

    @keyframes pulseGlow {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }

    .eye-icon {
      font-size: 26px;
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    }

    .eye-status-text {
      font-size: 6.5px;
      color: #bbb;
      margin-top: 4px;
      letter-spacing: 0.5px;
    }

    #eye-bomb-btn.ready .eye-status-text {
      color: #ffcc00;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Caluga Promocional Arriba de Todo -->
  <header id="promo-header">
    <div class="promo-info">
      <span class="promo-title">⚡ THUNDERCATS PASS</span>
      <span class="promo-sub">Consulta tu promoción o sorpresa VIP</span>
    </div>
    <a href="https://wa.me/56991081769?text=Hola!%20Tengo%20el%20cartucho%20ThunderCats%20y%20quiero%20conocer%20la%20promocion%20de%20hoy" class="btn-wa">
      WHATSAPP
    </a>
  </header>

  <!-- Pantalla de Juego -->
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- Botón Flotante Semitransparente del Ojo -->
    <div id="eye-bomb-btn">
      <span class="eye-icon" id="eyeIcon">👁️</span>
      <span class="eye-status-text" id="eyeText">0%</span>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');
    const eyeBtn = document.getElementById('eye-bomb-btn');
    const eyeIcon = document.getElementById('eyeIcon');
    const eyeText = document.getElementById('eyeText');

    function resizeCanvas() {
      canvas.width = container.clientWidth || window.innerWidth;
      canvas.height = container.clientHeight || (window.innerHeight - 54);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let score = 0;
    let highScore = 0;
    let level = 1;
    let gameState = 'START';
    let frames = 0;
    let levelUpTimer = 0;
    let flashScreenTimer = 0;

    let eyeKills = 0;
    const KILLS_NEEDED = 8;

    function updateEyeUI() {
      const pct = Math.min(100, Math.floor((eyeKills / KILLS_NEEDED) * 100));
      if (eyeKills >= KILLS_NEEDED) {
        eyeBtn.classList.add('ready');
        eyeIcon.textContent = "🔥";
        eyeText.textContent = "¡PODER!";
      } else {
        eyeBtn.classList.remove('ready');
        eyeIcon.textContent = "👁️";
        eyeText.textContent = pct + "%";
      }
    }

    const player = {
      x: 160,
      y: 0,
      w: 38,
      h: 44,
      targetX: 160,

      draw() {
        ctx.fillStyle = '#ff5500';
        ctx.fillRect(this.x + 4, this.y, 30, 14);

        ctx.fillStyle = '#ffcc99';
        ctx.fillRect(this.x + 8, this.y + 10, 22, 12);

        ctx.fillStyle = '#0055d4';
        ctx.fillRect(this.x + 6, this.y + 22, 26, 14);

        ctx.fillStyle = '#d32228';
        ctx.fillRect(this.x + 15, this.y + 28, 8, 8);

        ctx.fillStyle = '#ffcc99';
        ctx.fillRect(this.x + 8, this.y + 36, 8, 8);
        ctx.fillRect(this.x + 22, this.y + 36, 8, 8);
      },

      update() {
        this.x = Math.max(10, Math.min(canvas.width - this.w - 10, this.targetX - (this.w / 2)));
        this.y = canvas.height - 60;
      },

      reset() {
        this.targetX = canvas.width / 2;
        this.y = canvas.height - 60;
        this.update();
      }
    };

    let beams = [];
    const SHOOT_INTERVAL = 9;

    function autoShoot() {
      beams.push({ x: player.x + 8,  y: player.y - 8, w: 5, h: 22, speed: 10 });
      beams.push({ x: player.x + 25, y: player.y - 8, w: 5, h: 22, speed: 10 });
    }

    const MUTANT_TYPES = [
      { color: '#2f822d', hp: 1, w: 32, h: 22 },
      { color: '#b0651e', hp: 1, w: 34, h: 24 },
      { color: '#7b3ba8', hp: 1, w: 34, h: 24 },
      { color: '#2c3e50', hp: 1, w: 32, h: 20 }
    ];

    let enemies = [];
    function spawnEnemy() {
      const isMummRa = (Math.random() < 0.12 && score > 600);
      if (isMummRa) {
        enemies.push({
          type: 'MUMMRA',
          hp: 4,
          maxHp: 4,
          x: Math.random() * (canvas.width - 50 - 20) + 10,
          y: -46,
          w: 50,
          h: 40,
          speed: 1.0 + (level * 0.15)
        });
      } else {
        const t = MUTANT_TYPES[Math.floor(Math.random() * MUTANT_TYPES.length)];
        enemies.push({
          type: 'MUTANT',
          color: t.color,
          hp: t.hp,
          maxHp: t.hp,
          x: Math.random() * (canvas.width - t.w - 20) + 10,
          y: -30,
          w: t.w,
          h: t.h,
          speed: (0.8 + Math.random() * 0.5) + (level * 0.18)
        });
      }
    }

    function triggerEyeBomb() {
      if (eyeKills < KILLS_NEEDED) return;
      eyeKills = 0;
      updateEyeUI();

      flashScreenTimer = 16;

      enemies.forEach(en => {
        score += (en.type === 'MUMMRA' ? 500 : 100);
      });
      enemies = [];
    }

    function setTargetFromTouch(e) {
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      if (touch) {
        player.targetX = touch.clientX - rect.left;
      }
    }

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (gameState === 'START') {
        gameState = 'PLAY';
        score = 0;
        level = 1;
        eyeKills = 0;
        beams = [];
        enemies = [];
        player.reset();
        updateEyeUI();
      } else if (gameState === 'GAMEOVER') {
        gameState = 'START';
      } else {
        setTargetFromTouch(e);
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (gameState === 'PLAY') {
        setTargetFromTouch(e);
      }
    }, { passive: false });

    eyeBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (gameState === 'PLAY') {
        triggerEyeBomb();
      }
    }, { passive: false });

    function loop() {
      if (flashScreenTimer > 0) {
        flashScreenTimer--;
        ctx.fillStyle = (flashScreenTimer % 2 === 0) ? '#ffcc00' : '#e52521';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#0a0312';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#fff';
        ctx.fillRect(45, 30, 2, 2);
        ctx.fillRect(210, 80, 2, 2);
        ctx.fillRect(130, 150, 2, 2);
        ctx.fillRect(280, 240, 2, 2);
        ctx.fillRect(90, 310, 2, 2);
      }

      if (gameState === 'PLAY') {
        frames++;

        if (frames % SHOOT_INTERVAL === 0) {
          autoShoot();
        }

        const spawnRate = Math.max(36, 70 - (level * 6));
        if (frames % spawnRate === 0) spawnEnemy();

        const currentLevel = Math.floor(score / 3000) + 1;
        if (currentLevel > level) {
          level = currentLevel;
          levelUpTimer = 90;
        }

        player.update();
        player.draw();

        for (let i = 0; i < beams.length; i++) {
          let b = beams[i];
          b.y -= b.speed;

          ctx.fillStyle = '#ffcc00';
          ctx.fillRect(b.x - 1, b.y, b.w + 2, b.h);
          ctx.fillStyle = '#e52521';
          ctx.fillRect(b.x, b.y + 2, b.w, b.h - 4);

          if (b.y < -30) {
            beams.splice(i, 1);
            i--;
          }
        }

        for (let i = 0; i < enemies.length; i++) {
          let en = enemies[i];
          en.y += en.speed;

          if (en.type === 'MUMMRA') {
            ctx.fillStyle = '#a81316';
            ctx.fillRect(en.x, en.y, en.w, en.h);
            ctx.fillStyle = '#4c6572';
            ctx.fillRect(en.x + 8, en.y + 6, en.w - 16, 20);
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(en.x + 14, en.y + 12, 5, 5);
            ctx.fillRect(en.x + 30, en.y + 12, 5, 5);
            ctx.fillStyle = '#ffcc00';
            ctx.fillRect(en.x, en.y - 6, (en.w * (en.hp / en.maxHp)), 4);
          } else {
            ctx.fillStyle = en.color;
            ctx.fillRect(en.x, en.y + 6, en.w, en.h - 6);
            ctx.fillStyle = '#111';
            ctx.fillRect(en.x + 6, en.y, en.w - 12, 6);
            ctx.fillStyle = '#ffcc00';
            ctx.fillRect(en.x + 8, en.y + 10, 4, 4);
            ctx.fillRect(en.x + en.w - 12, en.y + 10, 4, 4);
          }

          for (let j = 0; j < beams.length; j++) {
            let b = beams[j];
            if (
              b.x < en.x + en.w &&
              b.x + b.w > en.x &&
              b.y < en.y + en.h &&
              b.y + b.h > en.y
            ) {
              en.hp--;
              beams.splice(j, 1);

              if (en.hp <= 0) {
                score += (en.type === 'MUMMRA' ? 500 : 100);
                enemies.splice(i, 1);
                i--;

                if (eyeKills < KILLS_NEEDED) {
                  eyeKills++;
                  updateEyeUI();
                }
              }
              break;
            }
          }

          if (
            en &&
            en.x < player.x + player.w &&
            en.x + en.w > player.x &&
            en.y < player.y + player.h &&
            en.y + en.h > player.y
          ) {
            gameState = 'GAMEOVER';
            if (score > highScore) highScore = score;
          }

          if (en && en.y > canvas.height) {
            gameState = 'GAMEOVER';
            if (score > highScore) highScore = score;
          }
        }

        ctx.fillStyle = '#ffcc00';
        ctx.font = '10px "Press Start 2P"';
        ctx.fillText("SCORE " + score, 14, 22);
        ctx.fillText("NIVEL " + level, canvas.width - 94, 22);

        if (levelUpTimer > 0) {
          levelUpTimer--;
          ctx.fillStyle = '#ffcc00';
          ctx.font = '12px "Press Start 2P"';
          ctx.textAlign = 'center';
          ctx.fillText("¡PASÓ DE NIVEL!", canvas.width / 2, canvas.height / 2 - 20);
          ctx.fillStyle = '#fff';
          ctx.font = '8px "Press Start 2P"';
          ctx.fillText("VELOCIDAD AUMENTADA", canvas.width / 2, canvas.height / 2 + 8);
          ctx.textAlign = 'left';
        }

      } else if (gameState === 'START') {
        player.reset();
        player.draw();

        ctx.fillStyle = '#ffcc00';
        ctx.font = '11px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText("THUNDERCATS", canvas.width / 2, canvas.height / 2 - 40);
        ctx.fillStyle = '#fff';
        ctx.font = '7.5px "Press Start 2P"';
        ctx.fillText("ARRASTRA TU DEDO PARA MOVER", canvas.width / 2, canvas.height / 2 - 14);
        ctx.fillText("DISPARO AUTOMÁTICO CONTINUO", canvas.width / 2, canvas.height / 2 + 6);
        ctx.fillStyle = '#00ffcc';
        ctx.fillText("TOCA LA PANTALLA PARA JUGAR", canvas.width / 2, canvas.height / 2 + 30);
        ctx.textAlign = 'left';

      } else if (gameState === 'GAMEOVER') {
        ctx.fillStyle = '#000';
        ctx.fillRect(canvas.width / 2 - 125, canvas.height / 2 - 50, 250, 100);
        ctx.strokeStyle = '#d32228';
        ctx.lineWidth = 3;
        ctx.strokeRect(canvas.width / 2 - 125, canvas.height / 2 - 50, 250, 100);

        ctx.fillStyle = '#d32228';
        ctx.font = '12px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);

        ctx.fillStyle = '#ffcc00';
        ctx.font = '8px "Press Start 2P"';
        ctx.fillText("PUNTOS: " + score, canvas.width / 2, canvas.height / 2 + 4);
        ctx.fillText("RECORD: " + highScore, canvas.width / 2, canvas.height / 2 + 20);
        ctx.textAlign = 'left';
      }

      requestAnimationFrame(loop);
    }

    player.reset();
    updateEyeUI();
    loop();
  </script>
</body>
</html>
