<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ThunderCats - El Ojo de Thundera</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: #060209;
      color: #fff;
      font-family: 'Press Start 2P', monospace, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Cabecera compacta */
    #header {
      height: 44px;
      background: #0f0516;
      border-bottom: 2px solid #d32228;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tc-badge {
      width: 22px;
      height: 22px;
      background: #d32228;
      border-radius: 50%;
      border: 2px solid #ffcc00;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .tc-title {
      font-size: 11px;
      color: #ffcc00;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 #d32228;
    }

    /* Pantalla de juego */
    #canvas-container {
      width: 100%;
      flex: 1;
      background: #12041f;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    /* Panel inferior */
    #bottom-panel {
      height: 46vh;
      background: #0c0312;
      border-top: 3px solid #ffcc00;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px 14px 10px;
    }

    /* Fila comercial: Promoción + Recuadro para Sándwich/Producto */
    .promo-row {
      background: #1a0824;
      border: 2px solid #d32228;
      border-radius: 10px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Recuadro reservado para tu imagen o gif */
    .product-slot {
      width: 48px;
      height: 48px;
      background: #2b0c3a;
      border: 1.5px dashed #ffcc00;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .promo-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .promo-text {
      font-size: 7.5px;
      line-height: 1.3;
      color: #fff;
    }

    .promo-text strong {
      color: #ffcc00;
      font-size: 8.5px;
      display: block;
    }

    .btn-wa {
      background: #25d366;
      color: #fff;
      text-decoration: none;
      font-size: 8px;
      font-weight: bold;
      padding: 6px 8px;
      border-radius: 6px;
      align-self: flex-start;
      border: 1.5px solid #1aa84f;
      box-shadow: 0 3px 0 #12632f;
    }

    .btn-wa:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    /* Mandos táctiles */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 1;
      padding-top: 6px;
    }

    .arrows-group {
      display: flex;
      gap: 10px;
    }

    .btn-arrow {
      width: 62px;
      height: 62px;
      background: #210d33;
      border: 3px solid #54227d;
      border-radius: 12px;
      color: #ffcc00;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 0 #12051d;
    }

    .btn-arrow:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #12051d;
      background: #ffcc00;
      color: #110517;
    }

    /* Botón del Ojo de Thundera con medidor de carga circular */
    .eye-btn-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      position: relative;
    }

    .eye-btn-container {
      position: relative;
      width: 82px;
      height: 82px;
    }

    .charge-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      pointer-events: none;
    }

    .charge-circle-bg {
      fill: none;
      stroke: #250933;
      stroke-width: 6;
    }

    .charge-circle-bar {
      fill: none;
      stroke: #00ffcc;
      stroke-width: 6;
      stroke-dasharray: 232;
      stroke-dashoffset: 232;
      transition: stroke-dashoffset 0.1s linear, stroke 0.2s;
    }

    .btn-eye {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #1c0827;
      border: 3px solid #551c72;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 5px 0 #0d0213;
      overflow: hidden;
    }

    .btn-eye.ready {
      background: linear-gradient(180deg, #e52521 0%, #8e0b0d 100%);
      border-color: #ffcc00;
      box-shadow: 0 5px 0 #520507, 0 0 16px rgba(255, 204, 0, 0.6);
      animation: pulseEye 0.7s infinite alternate;
    }

    @keyframes pulseEye {
      from { transform: scale(1); }
      to { transform: scale(1.04); }
    }

    .eye-icon {
      width: 44px;
      height: 44px;
    }

    .btn-label {
      font-size: 7px;
      color: #999;
      letter-spacing: 0.5px;
    }

    .btn-label.ready {
      color: #ffcc00;
    }
  </style>
</head>
<body>

  <header id="header">
    <div class="tc-badge">⚡</div>
    <div class="tc-title">THUNDERCATS ARCADE</div>
  </header>

  <div id="canvas-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div id="bottom-panel">
