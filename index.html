<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ThunderCats - Promo Arcade</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@700;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background-color: #000000;
      color: #fff;
      font-family: 'Press Start 2P', monospace, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* ============================================================
       1. CALUGA SUPERIOR COMERCIAL
       ============================================================ */
    #promo-card-top {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 68px;
      background: #10061e;
      border: 4px solid #00e5ff;
      outline: 2px solid #000;
      box-shadow: inset 0 0 0 2px #80f2ff, 0 4px 15px rgba(0, 229, 255, 0.45);
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      z-index: 9999;
    }

    .promo-thumb {
      width: 44px;
      height: 44px;
      background: #1c0836;
      border: 2px solid #00e5ff;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .promo-details {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      overflow: hidden;
    }

    .promo-tag {
      font-size: 7px;
      color: #00e5ff;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    .promo-subtext {
      font-family: 'Rubik', sans-serif;
      font-size: 11px;
      color: #ffffff;
      font-weight: 700;
      line-height: 1.2;
    }

    .btn-wa {
      background: #25d366;
      color: #ffffff;
      text-decoration: none;
      font-family: 'Rubik', sans-serif;
      font-size: 11px;
      font-weight: 900;
      padding: 10px 10px;
      border-radius: 6px;
      white-space: nowrap;
      border: 2px solid #1caa4f;
      box-shadow: 0 3px 0 #12632f;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .btn-wa:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #12632f;
    }

    /* ============================================================
       2. BARRA HUD ARCADE
       ============================================================ */
    #arcade-hud {
      position: fixed;
      top: 68px;
      left: 0;
      width: 100%;
      height: 44px;
      background: #090212;
      border-bottom: 2px solid #331244;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      z-index: 9998;
    }

    .hud-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hud-box {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .hud-label {
      font-size: 5.5px;
      color: #888;
    }

    .hud-val {
      font-size: 8px;
      color: #ffcc00;
    }

    .hud-lives {
      font-size: 9px;
      color: #ff3344;
      letter-spacing: 1px;
    }

    #eye-btn-top {
      height: 32px;
      padding: 0 8px;
      border-radius: 16px;
      background: #1c0926;
      border: 2px solid #4a1c66;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      box-shadow: 0 3px 0 #0c0211;
      transition: all 0.2s;
    }

    #eye-btn-top.ready {
      background: linear-gradient(180deg, #e52521 0%, #8e0b0d 100%);
      border-color: #ffcc00;
      box-shadow: 0 0 14px rgba(255, 204, 0, 0.8), 0 3px 0 #520507;
      animation: pulseEye 0.6s infinite alternate;
    }

    @keyframes pulseEye {
      from { transform: scale(1); }
      to { transform: scale(1.06); }
    }

    .eye-icon { font-size: 13px; line-height: 1; }
    .eye-txt { font-size: 6.5px; color: #aaa; }
    #eye-btn-top.ready .eye-txt { color: #ffcc00; font-weight: bold; }

    /* ============================================================
       3. PANTALLA DEL JUEGO
       ============================================================ */
    #game-container {
      position: absolute;
      top: 112px;
      bottom: 0;
      left: 0;
      right: 0;
      background: #000000;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>

  <!-- Caluga Superior -->
  <header id="promo-card-top">
    <div class="promo-thumb">🍔</div>
    <div class="promo-details">
      <div class="promo-tag">⚡ ¿CUÁL ES LA PROMO DE HOY?</div>
      <div class="promo-subtext">Pase VIP ThunderCats</div>
    </div>
    <a href="https://wa.me/56991081769?text=Hola!%20Tengo%20el%20cartucho%20ThunderCats,%20%C2%BFcu%C3%A1l%20es%20la%20promoci%C3%B3n%20sorpresa%20de%20hoy?" class="btn-wa">
      💬 WHATSAPP
    </a>
  </header>

  <!-- HUD: Puntos, Vidas, Nivel y Bomba Ojo -->
  <div id="arcade-hud">
    <div class="hud-group">
      <div class="hud-box">
        <span class="hud-label">PTS</span>
        <span class="hud-val" id="hudScore">0000</span>
      </div>
      <div class="hud-box">
        <span class="hud-label">VIDAS</span>
        <span class="hud-lives" id="hudLives">❤❤</span>
      </div>
      <div class="hud-box">
        <span class="hud-label">NIVEL</span>
        <span class="hud-val" id="hudLevel">1</span>
      </div>
    </div>

    <div id="eye-btn-top">
      <span class="eye-icon" id="eyeIcon">👁️</span>
      <span class="eye-txt" id="eyeTxt">0%</span>
    </div>
  </div>

  <!-- Pantalla de Juego -->
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');
    
    const hudScore = document.getElementById('hudScore');
    const hudLives = document.getElementById('hudLives');
    const hudLevel = document.getElementById('hudLevel');
    const eyeBtn = document.getElementById('eye-btn-top');
    const eyeIcon = document.getElementById('eyeIcon');
    const eyeTxt = document.getElementById('eyeTxt');

    // Carga de la imagen con el nombre exacto indicado
    const logoImg = new Image();
    logoImg.src = "logothunder.png";

    function resizeCanvas() {
      canvas.width = container.clientWidth || window.innerWidth;
      canvas.height = container.clientHeight || (window.innerHeight - 112);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let score = 0;
    let highScore = 0;
    let level = 1;
    let lives = 2;
    let nextLifeScore = 20000;
    let gameState = 'START';
    let frames = 0;
    let levelUpTimer = 0;
    let extraLifeTimer = 0;
    let flashScreenTimer = 0;
    let invulnerableTimer = 0;

    let eyeKills = 0;
    const KILLS_NEEDED = 7;

    function updateEyeUI() {
      const pct = Math.min(100, Math.floor((eyeKills / KILLS_NEEDED) * 100));
      if (eyeKills >= KILLS_NEEDED) {
        eyeBtn.classList.add('ready');
        eyeIcon.textContent = "🔥";
        eyeTxt.textContent = "PODER";
      } else {
        eyeBtn.classList.remove('ready');
        eyeIcon.textContent = "👁️";
        eyeTxt.textContent = pct + "%";
      }
      hudScore.textContent = score.toString().padStart(4, '0');
      hudLevel.textContent = level;
      hudLives.textContent = "❤".repeat(Math.max(0, lives));
    }

    const player = {
      x: 160,
      y: 0,
      w: 38,
      h: 44,
      targetX: 160,

      draw() {
        if (invulnerableTimer > 0 && Math.floor(invulnerableTimer / 4) % 2 === 0) return;

        ctx.fillStyle = '#ff5500';
        ctx.fillRect(this.x + 4, this.y, 30, 14);

        ctx.fillStyle = '#ffcc99';
        ctx.fillRect(this.x + 8, this.y + 10, 22, 12);

        ctx.fillStyle = '#0055d4';
        ctx.fillRect(this.x + 6, this.y + 22, 26, 14);

        ctx.fillStyle = '#d32228';
        ctx.fillRect(this.x + 15, this.y + 28, 8, 8);

        ctx.fillStyle = '#ffcc99';
        ctx.fillRect(this.x + 8, this.y + 36, 8, 8);
        ctx.fillRect(this.x + 22, this.y + 36, 8, 8);

        ctx.fillStyle = '#cccccc';
        ctx.fillRect(this.x + 18, this.y - 10, 3, 12);
        ctx.fillStyle = '#ffcc00';
        ctx.fillRect(this.x + 16, this.y + 2, 7, 3);
      },

      update() {
        this.x = Math.max(10, Math.min(canvas.width - this.w - 10, this.targetX - (this.w / 2)));
        this.y = canvas.height - 58;
      },

      reset() {
        this.targetX = canvas.width / 2;
        this.y = canvas.height - 58;
        this.update();
      }
    };

    let lightningBeams = [];
    const SHOOT_INTERVAL = 26;

    function shootLightning() {
      lightningBeams.push({
        x: player.x + 18,
        y: player.y - 12,
        speed: 7,
        length: 32,
        seed: Math.random() * 100
      });
    }

    function drawLightningBolt(b) {
      ctx.save();
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = '#00ffff';
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 8;

      ctx.beginPath();
      let startX = b.x;
      let startY = b.y;
      ctx.moveTo(startX, startY);

      let segs = 4;
      let segH = b.length / segs;
      for (let s = 1; s <= segs; s++) {
        let offsetX = (s % 2 === 0 ? 5 : -5);
        ctx.lineTo(startX + offsetX, startY + (s * segH));
      }
      ctx.stroke();

      ctx.lineWidth = 1.8;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
      ctx.restore();
    }

    const MUTANT_TYPES = [
      { color: '#2f822d', hp: 1, w: 32, h: 22 },
      { color: '#b0651e', hp: 1, w: 34, h: 24 },
      { color: '#7b3ba8', hp: 1, w: 34, h: 24 },
      { color: '#2c3e50', hp: 1, w: 32, h: 20 }
    ];

    let enemies = [];
    function spawnEnemy() {
      const isMummRa = (Math.random() < 0.12 && score > 600);
      if (isMummRa) {
        enemies.push({
          type: 'MUMMRA',
          hp: 4,
          maxHp: 4,
          x: Math.random() * (canvas.width - 50 - 20) + 10,
          y: -46,
          w: 50,
          h: 40,
          speed: 0.9 + (level * 0.12)
        });
      } else {
        const t = MUTANT_TYPES[Math.floor(Math.random() * MUTANT_TYPES.length)];
        enemies.push({
          type: 'MUTANT',
          color: t.color,
          hp: t.hp,
          maxHp: t.hp,
          x: Math.random() * (canvas.width - t.w - 20) + 10,
          y: -30,
          w: t.w,
          h: t.h,
          speed: (0.7 + Math.random() * 0.4) + (level * 0.15)
        });
      }
    }

    function triggerEyeBomb() {
      if (eyeKills < KILLS_NEEDED) return;
      eyeKills = 0;
      updateEyeUI();

      flashScreenTimer = 16;

      enemies.forEach(en => {
        score += (en.type === 'MUMMRA' ? 500 : 100);
      });
      enemies = [];
    }

    function loseLife() {
      if (invulnerableTimer > 0) return;
      lives--;
      updateEyeUI();

      if (lives <= 0) {
        gameState = 'GAMEOVER';
        if (score > highScore) highScore = score;
      } else {
        invulnerableTimer = 80;
        flashScreenTimer = 8;
      }
    }

    function setTargetFromTouch(e) {
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      if (touch) {
        player.targetX = touch.clientX - rect.left;
      }
    }

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (gameState === 'START') {
        gameState = 'PLAY';
        score = 0;
        level = 1;
        lives = 2;
        nextLifeScore = 20000;
        eyeKills = 0;
        lightningBeams = [];
        enemies = [];
        player.reset();
        updateEyeUI();
      } else if (gameState === 'GAMEOVER') {
        gameState = 'START';
      } else {
        setTargetFromTouch(e);
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (gameState === 'PLAY') {
        setTargetFromTouch(e);
      }
    }, { passive: false });

    eyeBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (gameState === 'PLAY') {
        triggerEyeBomb();
      }
    }, { passive: false });

    function loop() {
      if (flashScreenTimer > 0) {
        flashScreenTimer--;
        ctx.fillStyle = (flashScreenTimer % 2 === 0) ? '#ffcc00' : '#e52521';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Estrellas
        ctx.fillStyle = '#fff';
        ctx.fillRect(45, 30, 2, 2);
        ctx.fillRect(210, 80, 2, 2);
        ctx.fillRect(130, 160, 2, 2);
        ctx.fillRect(280, 260, 2, 2);
        ctx.fillRect(80, 320, 2, 2);
      }

      if (gameState === 'PLAY') {
        frames++;
        if (invulnerableTimer > 0) invulnerableTimer--;

        if (frames % SHOOT_INTERVAL === 0) {
          shootLightning();
        }

        const spawnRate = Math.max(38, 75 - (level * 5));
        if (frames % spawnRate === 0) spawnEnemy();

        const currentLevel = Math.floor(score / 3000) + 1;
        if (currentLevel > level) {
          level = currentLevel;
          levelUpTimer = 90;
        }

        if (score >= nextLifeScore) {
          lives++;
          nextLifeScore += 20000;
          extraLifeTimer = 90;
          updateEyeUI();
        }

        player.update();
        player.draw();

        for (let i = 0; i < lightningBeams.length; i++) {
          let b = lightningBeams[i];
          b.y -= b.speed;
          drawLightningBolt(b);

          if (b.y < -40) {
            lightningBeams.splice(i, 1);
            i--;
          }
        }

        for (let i = 0; i < enemies.length; i++) {
          let en = enemies[i];
          en.y += en.speed;

          if (en.type === 'MUMMRA') {
            ctx.fillStyle = '#a81316';
            ctx.fillRect(en.x, en.y, en.w, en.h);
            ctx.fillStyle = '#4c6572';
            ctx.fillRect(en.x + 8, en.y + 6, en.w - 16, 20);
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(en.x + 14, en.y + 12, 5, 5);
            ctx.fillRect(en.x + 30, en.y + 12, 5, 5);
            ctx.fillStyle = '#ffcc00';
            ctx.fillRect(en.x, en.y - 6, (en.w * (en.hp / en.maxHp)), 4);
          } else {
            ctx.fillStyle = en.color;
            ctx.fillRect(en.x, en.y + 6, en.w, en.h - 6);
            ctx.fillStyle = '#111';
            ctx.fillRect(en.x + 6, en.y, en.w - 12, 6);
            ctx.fillStyle = '#ffcc00';
            ctx.fillRect(en.x + 8, en.y + 10, 4, 4);
            ctx.fillRect(en.x + en.w - 12, en.y + 10, 4, 4);
          }

          for (let j = 0; j < lightningBeams.length; j++) {
            let b = lightningBeams[j];
            if (
              b.x > en.x - 8 &&
              b.x < en.x + en.w + 8 &&
              b.y < en.y + en.h &&
              b.y + b.length > en.y
            ) {
              en.hp--;
              lightningBeams.splice(j, 1);

              if (en.hp <= 0) {
                score += (en.type === 'MUMMRA' ? 500 : 100);
                enemies.splice(i, 1);
                i--;

                if (eyeKills < KILLS_NEEDED) {
                  eyeKills++;
                }
                updateEyeUI();
              }
              break;
            }
          }

          if (
            en &&
            en.x < player.x + player.w &&
            en.x + en.w > player.x &&
            en.y < player.y + player.h &&
            en.y + en.h > player.y
          ) {
            enemies.splice(i, 1);
            i--;
            loseLife();
          } else if (en && en.y > canvas.height) {
            enemies.splice(i, 1);
            i--;
            loseLife();
          }
        }

        if (levelUpTimer > 0) {
          levelUpTimer--;
          ctx.fillStyle = '#ffcc00';
          ctx.font = '11px "Press Start 2P"';
          ctx.textAlign = 'center';
          ctx.fillText("¡PASÓ DE NIVEL!", canvas.width / 2, canvas.height / 2 - 20);
          ctx.textAlign = 'left';
        }

        if (extraLifeTimer > 0) {
          extraLifeTimer--;
          ctx.fillStyle = '#00ff66';
          ctx.font = '11px "Press Start 2P"';
          ctx.textAlign = 'center';
          ctx.fillText("¡+1 VIDA EXTRA!", canvas.width / 2, canvas.height / 2 + 10);
          ctx.textAlign = 'left';
        }

      } else if (gameState === 'START') {
        // Muestra el logotipo únicamente aquí en la pantalla previa
        if (logoImg.complete && logoImg.naturalWidth > 0) {
          const aspect = logoImg.naturalWidth / logoImg.naturalHeight;
          let drawW = Math.min(canvas.width - 24, 340);
          let drawH = drawW / aspect;
          let drawX = (canvas.width - drawW) / 2;
          let drawY = (canvas.height / 2) - drawH - 10;
          ctx.drawImage(logoImg, drawX, drawY, drawW, drawH);
        }

        ctx.fillStyle = '#00e5ff';
        ctx.font = '8.5px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText("TOCA LA PANTALLA", canvas.width / 2, (canvas.height / 2) + 36);
        ctx.fillStyle = '#ffcc00';
        ctx.font = '7px "Press Start 2P"';
        ctx.fillText("INICIAS CON 2 VIDAS", canvas.width / 2, (canvas.height / 2) + 56);
        ctx.textAlign = 'left';

      } else if (gameState === 'GAMEOVER') {
        ctx.fillStyle = '#000';
        ctx.fillRect(canvas.width / 2 - 125, canvas.height / 2 - 50, 250, 100);
        ctx.strokeStyle = '#d32228';
        ctx.lineWidth = 3;
        ctx.strokeRect(canvas.width / 2 - 125, canvas.height / 2 - 50, 250, 100);

        ctx.fillStyle = '#d32228';
        ctx.font = '12px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);

        ctx.fillStyle = '#ffcc00';
        ctx.font = '8px "Press Start 2P"';
        ctx.fillText("PUNTOS: " + score, canvas.width / 2, canvas.height / 2 + 4);
        ctx.fillText("RECORD: " + highScore, canvas.width / 2, canvas.height / 2 + 20);
        ctx.textAlign = 'left';
      }

      requestAnimationFrame(loop);
    }

    player.reset();
    updateEyeUI();
    loop();
  </script>
</body>
</html>
